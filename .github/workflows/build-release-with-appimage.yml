name: Build Desktop Packages and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.6.6 or v0.6.6"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release information
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $INPUT_VERSION"
            echo "Use semantic versioning such as 0.6.6, v0.6.6, or 1.0.0-beta.1."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-deb
            os: ubuntu-latest
            command: npm run dist -- --linux deb AppImage --x64 --publish never
            files: |
              dist/*.deb
              dist/*.AppImage

          - name: linux-arm64-deb
            os: ubuntu-latest
            command: npm run dist -- --linux deb AppImage --arm64 --publish never
            files: |
              dist/*.deb
              dist/*.AppImage

          - name: windows-x64-exe
            os: windows-latest
            command: npm run dist -- --win --x64 --publish never
            files: dist/*.exe

          - name: windows-arm64-exe
            os: windows-latest
            command: npm run dist -- --win --arm64 --publish never
            files: dist/*.exe

          - name: macos-universal-dmg
            os: macos-latest
            command: npm run dist -- --mac --universal --publish never
            files: dist/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        shell: bash
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build package
        shell: bash
        run: ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqpet-${{ matrix.name }}-${{ needs.prepare.outputs.version }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        shell: bash
        run: |
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -n "$previous_tag" ]; then
            log_range="$previous_tag..HEAD"
          else
            log_range="HEAD"
          fi

          {
            echo "## 下载说明"
            echo
            echo "- Linux x64：amd64 DEB / AppImage"
            echo "- Linux ARM64：arm64 DEB / AppImage"
            echo "- Windows x64：x64 EXE"
            echo "- Windows ARM64：arm64 EXE"
            echo "- macOS：Universal DMG"
            echo
            echo "## 更新内容"
            echo
            git log --no-merges --pretty='- %s (%h)' "$log_range" || true
          } > notes.md

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: QQPet ${{ needs.prepare.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
